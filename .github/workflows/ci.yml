name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: ccp_test
          POSTGRES_USER: ccp
          POSTGRES_PASSWORD: ccp
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ccp -d ccp_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: ccp
      DB_PASSWORD: ccp
      REDIS_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pgsql, redis, intl, bcmath, zip
          coverage: none
          tools: composer:v2
      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('apps/api/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare .env
        run: cp ../../.env.example .env
      - name: Lint (Pint)
        run: ./vendor/bin/pint --test
      - name: Tests (Pest)
        run: php artisan test

  ai:
    name: AI (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/ai/uv.lock
      - run: uv sync --frozen
      - name: Lint (Ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests (pytest)
        run: uv run pytest -q

  web:
    name: Web (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Lint (ESLint + Prettier)
        run: |
          npm run lint
          npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (Vitest)
        run: npm run test
      - name: Build
        run: npm run build
