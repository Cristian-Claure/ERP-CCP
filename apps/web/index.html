<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B1020" />
    <meta name="description" content="CCP — Control Central de Procesos. Tu empresa, bajo control." />
    <title>CCP · Control Central de Procesos</title>
    <script>
      // Apply the persisted theme before first paint (avoids a flash of the wrong theme).
      ;(function () {
        try {
          var stored = JSON.parse(localStorage.getItem('ccp-theme') || '{}')
          var pref = (stored.state && stored.state.theme) || 'dark'
          var resolved =
            pref === 'system'
              ? window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
              : pref
          document.documentElement.classList.remove('dark', 'light')
          document.documentElement.classList.add(resolved)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
