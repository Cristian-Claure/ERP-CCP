memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 25M
expose_php = Off
date.timezone = UTC

; Dev runs over a bind mount (very slow file stats on Docker Desktop for Windows/macOS):
; opcache never re-stats files; docker/php/dev-reload.sh reloads php-fpm on source changes.
realpath_cache_size = 4096K
realpath_cache_ttl = 600

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
